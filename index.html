<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="styles.css">

    <script src="https://js.puter.com/v2/"></script>

    <title>GASTO DA FOTO</title>

</head>

<body>

    <div>

        <h1>📸 Gasto na Foto</h1>

        <p class="topo">
            Fotografe o comprovante. A IA anota pra você.
        </p>

    </div>


    <div class="caixa-total">

        <p>Total gasto</p>

        <h2 class="total-gasto">
            R$ 0,00
        </h2>

    </div>


    <label>

        🧾 Toque para adicionar o comprovante

        <input
            class="foto"
            onchange="lerFoto()"
            type="file"
            accept="image/*"
        >

    </label>


    <div class="lista">

    </div>


    <script src="scripts.js"></script>

</body>

</html>
